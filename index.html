document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ht: 700;\n  font-display: swap;\n  src: url(\"8204a513-98a0-40b4-8bae-3fa99fa4e1d8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"7ee60cd9-fda5-46b8-be8e-dfacd079f1cb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"8204a513-98a0-40b4-8bae-3fa99fa4e1d8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n/* =====================================================================\n   NeuroHome design system — tokens + component styles (single entry).\n   Palette consolidated to one job each: cyan = action, blue = accents,\n   azure = gradient/tints, azure-pale = dark-bg accent, navy = dark bg.\n   ===================================================================== */\n:root{\n  /* neutrals */\n  --nh-sand:#F4F0EA; --nh-sand-2:#EFEAE2; --nh-paper:#FBFAF7;\n  --nh-ink:#1D2939; --nh-ink-dim:#475467; --nh-slate:#545D6E;\n  --nh-hair:rgba(20,24,35,0.10); --nh-hair-strong:rgba(20,24,35,0.14);\n  /* dark */\n  --nh-navy:#0E1420; --nh-light:#EAF0F6; --nh-light-dim:rgba(234,240,246,0.62); --nh-light-hair:rgba(234,240,246,0.10);\n  /* blues */\n  --nh-cyan:#00C2FF; --nh-azure:#2BA8E0; --nh-azure-pale:#7BC9EC; --nh-blue:#2559C0;\n  --nh-grad:linear-gradient(135deg,var(--nh-azure),#2D6FD9);\n  --nh-grad-light:linear-gradient(135deg,var(--nh-azure),var(--nh-azure-pale));\n  /* geometry + type */\n  --nh-radius:16px; --nh-radius-lg:22px; --nh-pill:100px;\n  --nh-shadow-brand:0 10px 30px rgba(0,194,255,.28);\n  --nh-shadow-md:0 14px 40px rgba(20,24,35,.08);\n  --nh-f-display:'Outfit',sans-serif; /* @kind font */\n  --nh-f-body:'DM Sans',system-ui,sans-serif; /* @kind font */\n  --nh-f-mono:'JetBrains Mono',monospace; /* @kind font */\n}\n\n/* ---- GradientText ---- */\n.nh-grad-text{background:var(--nh-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}\n.nh-grad-text--light{background:var(--nh-grad-light);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}\n\n/* ---- Button ---- */\n.nh-btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--nh-f-body);font-weight:600;font-size:15px;border-radius:var(--nh-pill);padding:15px 28px;border:1px solid transparent;cursor:pointer;transition:all .22s cubic-bezier(.16,1,.3,1);white-space:nowrap;text-decoration:none;line-height:1}\n.nh-btn--primary{background:var(--nh-cyan);color:#062A36;box-shadow:var(--nh-shadow-brand)}\n.nh-btn--primary:hover{background:#22CBFF;transform:translateY(-1px)}\n.nh-btn--ghost{background:transparent;color:var(--nh-ink);border-color:var(--nh-hair-strong)}\n.nh-btn--ghost:hover{background:var(--nh-ink);color:#fff;border-color:var(--nh-ink)}\n.nh-btn--lg{padding:17px 32px;font-size:16px}\n.nh-btn:focus-visible{outline:3px solid var(--nh-blue);outline-offset:3px}\n\n/* ---- Pill / Badge ---- */\n.nh-pill{display:inline-flex;align-items:center;gap:9px;font-family:var(--nh-f-mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--nh-blue);background:rgba(43,168,224,.09);border:1px solid rgba(43,168,224,.28);padding:8px 16px;border-radius:var(--nh-pill)}\n.nh-pill__dot{width:7px;height:7px;border-radius:50%;background:#E8960C}\n\n/* ---- Kicker (eyebrow) ---- */\n.nh-kicker{font-family:var(--nh-f-mono);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--nh-blue);display:inline-flex;align-items:center;gap:10px}\n.nh-kicker__num{color:#7C7C90;font-weight:700}\n.nh-kicker--dark{color:var(--nh-azure-pale)}\n\n/* ---- Card (icon feature) ---- */\n.nh-card{background:var(--nh-paper);border:1px solid var(--nh-hair);border-radius:var(--nh-radius);padding:26px 24px;transition:.3s cubic-bezier(.16,1,.3,1)}\n.nh-card:hover{transform:translateY(-3px);box-shadow:var(--nh-shadow-md);border-color:var(--nh-hair-strong)}\n.nh-card__ic{width:40px;height:40px;border-radius:11px;background:rgba(43,168,224,.10);color:var(--nh-blue);display:flex;align-items:center;justify-content:center;margin-bottom:16px}\n.nh-card__title{font-family:var(--nh-f-display);font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}\n.nh-card__body{font-family:var(--nh-f-body);font-size:14px;color:var(--nh-ink-dim);line-height:1.6;margin:0}\n\n/* ---- StepCard (numbered process step) ---- */\n.nh-step{background:var(--nh-paper);border:1px solid var(--nh-hair);border-radius:var(--nh-radius);padding:26px 22px}\n.nh-step__n{font-family:var(--nh-f-display);font-size:34px;font-weight:800;line-height:1;background:var(--nh-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px}\n.nh-step__tag{font-family:var(--nh-f-mono);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--nh-blue);display:block;margin-bottom:14px}\n.nh-step__title{font-family:var(--nh-f-display);font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:0 0 10px}\n.nh-step__body{font-family:var(--nh-f-body);font-size:13px;color:var(--nh-ink-dim);line-height:1.6;margin:0}\n\n/* ---- ProcessStep (horizontal timeline column) ---- */\n.nh-process{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}\n.nh-pstep{position:relative}\n.nh-pstep__rail{position:relative;height:2px;background:var(--nh-hair-strong);margin-bottom:26px}\n.nh-pstep__dot{position:absolute;left:0;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:var(--nh-sand);border:2px solid var(--nh-azure);box-sizing:border-box}\n.nh-pstep[data-active] .nh-pstep__dot{background:var(--nh-cyan);border-color:var(--nh-cyan)}\n.nh-pstep__n{font-family:var(--nh-f-display);font-size:34px;font-weight:800;line-height:1;background:var(--nh-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:14px}\n.nh-pstep__tag{font-family:var(--nh-f-mono);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--nh-blue);display:block;margin-bottom:12px}\n.nh-pstep__title{font-family:var(--nh-f-display);font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:0 0 10px}\n.nh-pstep__body{font-family:var(--nh-f-body);font-size:13px;color:var(--nh-ink-dim);line-height:1.6;margin:0}\n@media(max-width:1080px){.nh-process{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:560px){.nh-process{grid-template-columns:1fr}.nh-pstep__rail{width:36px}}\n\n/* ---- StatItem (compact stat / trust signal) ---- */\n.nh-stat{padding:22px 18px}\n.nh-stat__ic{width:22px;height:22px;color:var(--nh-blue);margin-bottom:12px}\n.nh-stat__value{font-family:var(--nh-f-display);font-size:17px;font-weight:700;color:var(--nh-ink);display:block;letter-spacing:-.01em}\n.nh-stat__label{font-family:var(--nh-f-mono);font-size:10px;letter-spacing:.06em;color:var(--nh-ink-dim);line-height:1.5;display:block;margin-top:6px;text-transform:uppercase}\n\n/* ---- Panel (bordered content container) ---- */\n.nh-panel{background:var(--nh-paper);border:1px solid var(--nh-hair);border-radius:var(--nh-radius);padding:32px}\n.nh-panel__h{font-family:var(--nh-f-mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--nh-ink-dim);margin:0 0 18px}\n\n/* ---- Quote (testimonial) ---- */\n.nh-quote{background:var(--nh-paper);border:1px solid var(--nh-hair);border-radius:var(--nh-radius);padding:26px 24px;display:flex;flex-direction:column}\n.nh-quote__q{font-family:var(--nh-f-display);font-size:18px;font-weight:600;line-height:1.4;letter-spacing:-.01em;border-left:3px solid var(--nh-azure);padding-left:16px;margin:0 0 18px}\n.nh-quote__meta{margin-top:auto}\n.nh-quote__name{font-family:var(--nh-f-display);font-size:14px;font-weight:700}\n.nh-quote__detail{display:block;font-family:var(--nh-f-body);font-size:12px;color:var(--nh-slate)}\n\n/* ---- FAQItem (accordion) ---- */\n.nh-faq{border-bottom:1px solid var(--nh-hair)}\n.nh-faq__q{width:100%;background:none;border:none;text-align:left;font-family:var(--nh-f-display);font-size:16.5px;font-weight:700;color:var(--nh-ink);padding:20px 0;display:flex;justify-content:space-between;gap:16px;align-items:center;cursor:pointer;letter-spacing:-.01em}\n.nh-faq__q:focus-visible{outline:3px solid var(--nh-blue);outline-offset:3px}\n.nh-faq__chev{width:20px;height:20px;color:var(--nh-slate);transition:transform .25s;flex:none}\n.nh-faq[data-open=\"true\"] .nh-faq__chev{transform:rotate(180deg)}\n.nh-faq__a{overflow:hidden;transition:max-height .3s ease}\n.nh-faq__a-inner{padding:0 0 20px;font-family:var(--nh-f-body);color:var(--nh-ink-dim);font-size:14.5px;line-height:1.7}\n\n/* ---- Section (page section wrapper) ---- */\n.nh-section{padding:clamp(64px,8vw,112px) 0;position:relative}\n.nh-section--sand{background:var(--nh-sand)}\n.nh-section--sand2{background:var(--nh-sand-2)}\n.nh-section--dark{background:var(--nh-navy);color:var(--nh-light)}\n.nh-section__wrap{max-width:1160px;margin:0 auto;padding:0 clamp(22px,5vw,60px)}\n\n/* ---- Brand (logo lockup) ---- */\n.nh-brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;line-height:1.1}\n.nh-brand__word{display:flex;flex-direction:column;gap:2px}\n.nh-brand__name{font-family:var(--nh-f-display);font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--nh-ink)}\n.nh-brand__name span{color:var(--nh-cyan)}\n.nh-brand__tag{font-family:var(--nh-f-body);font-size:11px;font-weight:500;letter-spacing:.4px;color:#667085}\n.nh-brand--light .nh-brand__name{color:#fff}\n.nh-brand--light .nh-brand__tag{color:#8593A8}\n\n/* ---- CredentialCard (image overlay label) ---- */\n.nh-cred{background:var(--nh-paper);border:1px solid var(--nh-hair);border-radius:14px;padding:14px 18px;box-shadow:var(--nh-shadow-md);max-width:255px}\n.nh-cred__name{font-family:var(--nh-f-display);font-size:15px;font-weight:700;color:var(--nh-ink);display:block}\n.nh-cred__sub{font-family:var(--nh-f-body);font-size:11.5px;color:var(--nh-slate)}\n\n<\u002Fstyle>\n<script src=\"4f75a3c7-c7eb-40f4-ac3e-8634d01e73f8\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: #F4F0EA; color: #1D2939; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  a { color: #2559C0; text-decoration: none; }\n  a:hover { color: #00C2FF; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px) 96px;\">\n\n  <div style=\"position: sticky; top: 0; z-index: 40; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 14px 0; margin-bottom: 8px; background: rgba(244,240,234,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(20,24,35,0.10);\">\n    <img src=\"07a93a48-4c75-4cee-bade-4b151ac843dc\" alt=\"NeuroHome\" style=\"height: 22px; width: auto; margin-right: 6px;\">\n    <a href=\"#identity\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #545D6E;\">01 Identity<\u002Fa>\n    <a href=\"#logo\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #545D6E;\">02 Logo<\u002Fa>\n    <a href=\"#icon\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #545D6E;\">03 Icon<\u002Fa>\n    <a href=\"#color\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #545D6E;\">04 Colour<\u002Fa>\n    <a href=\"#type\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #545D6E;\">05 Type<\u002Fa>\n    <a href=\"#components\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #545D6E;\">06 Components<\u002Fa>\n    <a href=\"#voice\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #545D6E;\">07 Voice<\u002Fa>\n    <a href=\"#endorser\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #545D6E;\">08 Endorser<\u002Fa>\n    <a href=\"#applications\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #545D6E;\">09 Applications<\u002Fa>\n    <a href=\"#tokens\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #545D6E;\">10 Tokens<\u002Fa>\n  <\u002Fdiv>\n\n  <header style=\"padding: clamp(56px, 9vw, 112px) 0 clamp(48px, 7vw, 88px); border-bottom: 1px solid rgba(20,24,35,0.10);\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 12px; margin-bottom: clamp(40px, 7vw, 80px); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E;\">\n      <span>Brand Identity System<\u002Fspan>\n      <span>{{ versionLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <img src=\"f6a9a15c-cecd-4615-afde-72d88f6bc8ed\" alt=\"NeuroHome house mark\" style=\"width: 76px; height: 76px; display: block; margin-bottom: clamp(28px, 4vw, 44px);\">\n    <h1 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(48px, 9vw, 92px); font-weight: 800; letter-spacing: -0.035em; line-height: 0.98; color: #0E1420; margin: 0 0 24px;\">Neuro<span style=\"color: #00C2FF;\">Home<\u002Fspan><\u002Fh1>\n    <p style=\"font-size: clamp(17px, 2vw, 21px); line-height: 1.65; color: #475467; max-width: 620px; margin: 0 0 36px; text-wrap: pretty;\">Functional neurology for kids on the spectrum — from home. Clinician-guided, drug-free, science-backed protocols by Neurosage HUB. This is the working reference for anyone producing NeuroHome material.<\u002Fp>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n      <span class=\"nh-pill\">Logo &amp; assets<\u002Fspan>\n      <span class=\"nh-pill\">Colour<\u002Fspan>\n      <span class=\"nh-pill\">Typography<\u002Fspan>\n      <span class=\"nh-pill\">Components<\u002Fspan>\n      <span class=\"nh-pill\">Voice<\u002Fspan>\n      <span class=\"nh-pill\">Tokens<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ showChangelog }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"padding: clamp(40px, 6vw, 72px) 0; border-bottom: 1px solid rgba(20,24,35,0.10);\">\n      <span class=\"nh-kicker\"><span class=\"nh-kicker__num\">00<\u002Fspan>What changed<\u002Fspan>\n      <h2 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; color: #0E1420; margin: 14px 0 28px;\">Updated from v1<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\">\n        <div class=\"nh-panel\"><div class=\"nh-panel__h\">Endorser<\u002Fdiv><p style=\"margin: 0; font-size: 14.5px; line-height: 1.7; color: #475467;\">The endorsement line is now <strong style=\"color: #1D2939;\">by Neurosage HUB<\u002Fstrong> in every lockup, signature and footer. \"by NeuroSolution Centers\" is retired — replace any artwork still carrying it.<\u002Fp><\u002Fdiv>\n        <div class=\"nh-panel\"><div class=\"nh-panel__h\">Logo files<\u002Fdiv><p style=\"margin: 0; font-size: 14.5px; line-height: 1.7; color: #475467;\">Exported PNG and SVG files are now the source of truth. Inline SVG stays available for code, but it must match the files.<\u002Fp><\u002Fdiv>\n        <div class=\"nh-panel\"><div class=\"nh-panel__h\">Cyan<\u002Fdiv><p style=\"margin: 0; font-size: 14.5px; line-height: 1.7; color: #475467;\">Canonical cyan is <strong style=\"color: #1D2939;\">#00C2FF<\u002Fstrong>. The <span style=\"font-family: 'JetBrains Mono', monospace;\">#00CEFD<\u002Fspan> value found in an older logo snippet is a legacy stray — do not use it.<\u002Fp><\u002Fdiv>\n        <div class=\"nh-panel\"><div class=\"nh-panel__h\">Type &amp; surface<\u002Fdiv><p style=\"margin: 0; font-size: 14.5px; line-height: 1.7; color: #475467;\">Body type moves from Inter to <strong style=\"color: #1D2939;\">DM Sans<\u002Fstrong>, and the page base moves from white to Sand, matching the NeuroHome design system.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section id=\"identity\" style=\"padding: clamp(48px, 7vw, 88px) 0; border-bottom: 1px solid rgba(20,24,35,0.10);\">\n    <span class=\"nh-kicker\"><span class=\"nh-kicker__num\">01<\u002Fspan>Identity<\u002Fspan>\n    <h2 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; color: #0E1420; margin: 14px 0 16px;\">Brand essence<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 1.7; color: #475467; max-width: 620px; margin: 0 0 36px; text-wrap: pretty;\">NeuroHome reads as warm, clinical and empowering. It brings the expertise of a neurological clinic into the safety of a family's living room.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 32px;\">\n      <div class=\"nh-panel\"><div class=\"nh-panel__h\">Mission<\u002Fdiv><p style=\"margin: 0; font-size: 15px; line-height: 1.75; color: #475467;\">Deliver clinician-guided, drug-free functional neurology protocols to families raising children on the spectrum — accessible from home, backed by a decade of clinical evidence.<\u002Fp><\u002Fdiv>\n      <div class=\"nh-panel\"><div class=\"nh-panel__h\">Emotional output<\u002Fdiv><p style=\"margin: 0; font-size: 15px; line-height: 1.75; color: #475467;\">Relief and hope. The feeling that expert care isn't distant — it's right here, in your home, guided by someone who understands your child.<\u002Fp><\u002Fdiv>\n      <div class=\"nh-panel\"><div class=\"nh-panel__h\">Personality<\u002Fdiv><p style=\"margin: 0; font-size: 15px; line-height: 1.75; color: #475467;\">Warm but precise. Empathetic but evidence-based. NeuroHome speaks like a trusted clinician who happens to make house calls.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #0E1420; border-radius: 22px; padding: clamp(28px, 4vw, 48px);\">\n      <span class=\"nh-kicker nh-kicker--dark\">Positioning<\u002Fspan>\n      <p style=\"font-family: 'Outfit', sans-serif; font-size: clamp(22px, 3vw, 32px); font-weight: 700; line-height: 1.4; color: #EAF0F6; max-width: 760px; margin: 18px 0 0; text-wrap: pretty;\">The same protocol that's helped families across 6 continents — <span style=\"color: #00C2FF;\">now it comes home.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: rgba(20,24,35,0.10); border: 1px solid rgba(20,24,35,0.10); border-radius: 16px; overflow: hidden; margin-top: 32px;\">\n      <div style=\"background: #FBFAF7; padding: 26px 22px;\"><div style=\"font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 800; color: #00C2FF; line-height: 1;\">01<\u002Fdiv><div style=\"font-weight: 700; font-size: 15px; color: #1D2939; margin: 10px 0 4px;\">Accessible<\u002Fdiv><div style=\"font-size: 13.5px; color: #545D6E;\">Clinical care, from home<\u002Fdiv><\u002Fdiv>\n      <div style=\"background: #FBFAF7; padding: 26px 22px;\"><div style=\"font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 800; color: #00C2FF; line-height: 1;\">02<\u002Fdiv><div style=\"font-weight: 700; font-size: 15px; color: #1D2939; margin: 10px 0 4px;\">Evidence-based<\u002Fdiv><div style=\"font-size: 13.5px; color: #545D6E;\">Science, not speculation<\u002Fdiv><\u002Fdiv>\n      <div style=\"background: #FBFAF7; padding: 26px 22px;\"><div style=\"font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 800; color: #00C2FF; line-height: 1;\">03<\u002Fdiv><div style=\"font-weight: 700; font-size: 15px; color: #1D2939; margin: 10px 0 4px;\">Empowering<\u002Fdiv><div style=\"font-size: 13.5px; color: #545D6E;\">Parents as partners<\u002Fdiv><\u002Fdiv>\n      <div style=\"background: #FBFAF7; padding: 26px 22px;\"><div style=\"font-family: 'Outfit', sans-serif; font-size: 30px; font-weight: 800; color: #00C2FF; line-height: 1;\">04<\u002Fdiv><div style=\"font-weight: 700; font-size: 15px; color: #1D2939; margin: 10px 0 4px;\">Drug-free<\u002Fdiv><div style=\"font-size: 13.5px; color: #545D6E;\">Neurological, not pharmaceutical<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"logo\" style=\"padding: clamp(48px, 7vw, 88px) 0; border-bottom: 1px solid rgba(20,24,35,0.10);\">\n    <span class=\"nh-kicker\"><span class=\"nh-kicker__num\">02<\u002Fspan>Logo<\u002Fspan>\n    <h2 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; color: #0E1420; margin: 14px 0 16px;\">Logo system<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 1.7; color: #475467; max-width: 660px; margin: 0 0 36px; text-wrap: pretty;\">A house drawn as a connected network — the home as a place of neurological growth. The wordmark is split: \"Neuro\" in ink, \"Home\" in cyan. The exported files below are the source of truth; anything redrawn must match them.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; padding: 48px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; min-height: 260px; position: relative;\">\n        <span style=\"position: absolute; top: 16px; left: 20px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #98A2B3;\">Primary · on light<\u002Fspan>\n        <img src=\"70644464-8dce-4251-aae4-dd135d5bfa26\" alt=\"NeuroHome primary lockup on light\" style=\"width: 100%; max-width: 340px; height: auto;\">\n      <\u002Fdiv>\n      <div style=\"background: #0E1420; border-radius: 22px; padding: 48px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; min-height: 260px; position: relative;\">\n        <span style=\"position: absolute; top: 16px; left: 20px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(234,240,246,0.62);\">Primary · on dark<\u002Fspan>\n        <img src=\"872eefab-b4b8-450d-8f36-b65e13d461be\" alt=\"NeuroHome primary lockup on dark\" style=\"width: 100%; max-width: 340px; height: auto;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-bottom: 40px;\">\n      <div style=\"background: #FBFAF7; border: 1px solid rgba(20,24,35,0.10); border-radius: 16px; overflow: hidden;\">\n        <div style=\"background: #FFFFFF; padding: 28px 20px; displ detail.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #0E1420; border-radius: 22px; padding: clamp(24px, 3vw, 40px); display: flex; flex-wrap: wrap; align-items: center; gap: 32px;\">\n      <img src=\"0d5f7b63-b4a1-45de-9325-5254cf93a588\" alt=\"House mark, light\" style=\"width: 92px; height: 92px;\">\n      <div style=\"flex: 1 1 320px; min-width: 0;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(234,240,246,0.62); margin-bottom: 10px;\">Tone pairing<\u002Fdiv>\n        <p style=\"margin: 0; font-size: 15.5px; line-height: 1.8; color: #EAF0F6;\">On light surfaces the strokes are Ink #1D2939. On navy and photography the strokes go white. The nodes stay cyan in both cases — cyan never changes to carry contrast.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"color\" style=\"padding: clamp(48px, 7vw, 88px) 0; border-bottom: 1px solid rgba(20,24,35,0.10);\">\n    <span class=\"nh-kicker\"><span class=\"nh-kicker__num\">04<\u002Fspan>Colour<\u002Fspan>\n    <h2 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; color: #0E1420; margin: 14px 0 16px;\">Colour system<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 1.7; color: #475467; max-width: 660px; margin: 0 0 36px; text-wrap: pretty;\">A warm Sand base, a Navy counterweight, and a blue family that runs from Cyan to Blue. Cyan is the action colour: buttons, nodes, the \"Home\" in the wordmark. Nothing else gets to be cyan.<\u002Fp>\n\n    <div style=\"display: flex; border-radius: 16px; overflow: hidden; height: 72px; margin-bottom: 40px; border: 1px solid rgba(20,24,35,0.10);\">\n      <div style=\"flex: 1; background: #FBFAF7;\"><\u002Fdiv>\n      <div style=\"flex: 1; background: #F4F0EA;\"><\u002Fdiv>\n      <div style=\"flex: 1; background: #EFEAE2;\"><\u002Fdi , monospace; font-size: 11px; color: #545D6E;\">#EFEAE2<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; overflow: hidden;\"><div style=\"height: 84px; background: #545D6E;\"><\u002Fdiv><div style=\"padding: 12px 14px; background: #FFFFFF; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 13.5px;\">Slate<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E;\">#545D6E<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; overflow: hidden;\"><div style=\"height: 84px; background: #1D2939;\"><\u002Fdiv><div style=\"padding: 12px 14px; background: #FFFFFF; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 13.5px;\">Ink<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E;\">#1D2939<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; overflow: hidden;\"><div style=\"height: 84px; background: #0E1420;\"><\u002Fdiv><div style=\"padding: 12px 14px; background: #FFFFFF; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 13.5px;\">Navy<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E;\">#0E1420<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-bottom: 40px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E; margin-bottom: 16px;\">Blues — signal &amp; accent<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;\">\n        <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; overflow: hidden;\"><div style=\"height: 96px; background: #00C2FF;\"><\u002Fdiv><div style=\"padding: 12px 14px; background: #FFFFFF; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 13.5px;\">Cyan — action<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E;\">#00C2FF<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; overflow: hidden;\"><div style=\"height: 96px; background: #2BA8E0;\"><\u002Fdiv><div style=\"padding: 12px 14px; background: #FFFFFF; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 13.5px;\">Azure<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E;\">#2BA8E0<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; overflow: hidden;\"><div style=\"height: 96px; background: #7BC9EC;\"><\u002Fdiv><div style=\"padding: 12px 14px; background: #FFFFFF; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 13.5px;\">Azure pale<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E;\">#7BC9EC<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; overflow: hidden;\"><div style=\"height: 96px; background: #2559C0;\"><\u002Fdiv><div style=\"padding: 12px 14px; background: #FFFFFF; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 13.5px;\">Blue — links<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E;\">#2559C0<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.75; color: #475467; margin: 16px 0 0; max-width: 680px;\">Canonical cyan is <strong style=\"color: #1D2939;\">#00C2FF<\u002Fstrong>. An older logo snippet carries #00CEFD — that value is retired and should be corrected wherever it appears in code.<\u002Fp>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E; margin-bottom: 16px;\">Secondary accents — use sparingly<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;\">\n        <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; overflow: hidden;\"><div style=\"height: 84px; background: #FF8A65;\"><\u002Fdiv><div style=\"padding: 12px 14px; background: #FFFFFF; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 13.5px;\">Warmth<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E;\">#FF8A65 · empathy, human moments<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; overflow: hidden;\"><div style=\"height: 84px; background: #66BB6A;\"><\u002Fdiv><div style=\"padding: 12px 14px; background: #FFFFFF; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 13.5px;\">Sage<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E;\">#66BB6A · progress, milestones<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; overflow: hidden;\"><div style=\"height: 84px; background: #AB7AFF;\"><\u002Fdiv><div style=\"padding: 12px 14px; background: #FFFFFF; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 13.5px;\">Lavender<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E;\">#AB7AFF · neurology, cognition<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.75; color: #475467; margin: 16px 0 0; max-width: 680px;\">Accents are for charts, progress states and illustration only. They never appear in the logo, in buttons, or as a section background, and only one accent may appear in a single view.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"type\" style=\"padding: clamp(48px, 7vw, 88px) 0; border-bottom: 1px solid rgba(20,24,35,0.10);\">\n    <span class=\"nh-kicker\"><span class=\"nh-kicker__num\">05<\u002Fspan>Typography<\u002Fspan>\n    <h2 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; color: #0E1420; margin: 14px 0 16px;\">Type system<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 1.7; color: #475467; max-width: 660px; margin: 0 0 36px; text-wrap: pretty;\">Outfit for display energy, DM Sans for body warmth, JetBrains Mono for clinical data and labels. DM Sans replaces Inter as of this version.<\u002Fp>\n\n    <div style=\"background: #FBFAF7; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; overflow: hidden; margin-bottom: 24px;\">\n      <div style=\"padding: clamp(24px, 3vw, 40px); border-bottom: 1px solid rgba(20,24,35,0.10);\">\n        <div style=\"font-family: 'Outfit', sans-serif; font-size: clamp(36px, 6vw, 60px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; color: #0E1420;\">Neuro<span style=\"color: #00C2FF;\">Home<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3; margin-top: 12px;\">Outfit ExtraBold · display · headlines, hero, wordmark<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: clamp(24px, 3vw, 40px); border-bottom: 1px solid rgba(20,24,35,0.10);\">\n        <div style=\"font-size: clamp(19px, 2.4vw, 24px); font-weight: 500; line-height: 1.5; color: #1D2939; text-wrap: pretty;\">Functional neurology for children on the spectrum, delivered through clinician-guided protocols families can run at home.<\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3; margin-top: 12px;\">DM Sans Medium · lead · subheads, intros<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: clamp(24px, 3vw, 40px); border-bottom: 1px solid rgba(20,24,35,0.10);\">\n        <div style=\"font-size: 16px; line-height: 1.75; color: #475467; max-width: 700px;\">Each child receives a personalised protocol based on comprehensive neurological assessment. Parents are trained to deliver daily exercises targeting specific brain regions — building new neural pathways through repetition and precision, not medication.<\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3; margin-top: 12px;\">DM Sans Regular · body · long-form, descriptions<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: clamp(24px, 3vw, 40px);\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.9; color: #475467;\">protocol_v3.2 | assessment_complete: true<br>regions: [cerebellum, prefrontal_cortex, vestibular]<br>session_frequency: \"daily\" | duration_weeks: 12<\u002Fdiv>\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3; margin-top: 12px;\">JetBrains Mono · data · kickers, clinical data, code<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #FBFAF7; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; padding: clamp(22px, 3vw, 32px);\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E; margin-bottom: 20px;\">Scale<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 28px; padding-bottom: 12px; border-bottom: 1px solid rgba(20,24,35,0.10);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3; min-width: 56px;\">display<\u002Fspan><span style=\"font-family: 'Outfit', sans-serif; font-size: 48px; font-weight: 800; color: #0E1420; line-height: 1;\">Aa<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3;\">48–92px · Outfit 800 · −0.03em<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 28px; padding-bottom: 12px; border-bottom: 1px solid rgba(20,24,35,0.10);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3; min-width: 56px;\">h2<\u002Fspan><span style=\"font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; color: #0E1420; line-height: 1;\">Aa<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3;\">28–40px · Outfit 800 · −0.02em<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 28px; padding-bottom: 12px; border-bottom: 1px solid rgba(20,24,35,0.10);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3; min-width: 56px;\">lead<\u002Fspan><span style=\"font-size: 21px; font-weight: 500; color: #1D2939; line-height: 1;\">Aa<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3;\">19–24px · DM Sans 500<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 28px; padding-bottom: 12px; border-bottom: 1px solid rgba(20,24,35,0.10);\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3; min-width: 56px;\">body<\u002Fspan><span style=\"font-size: 16px; color: #475467; line-height: 1;\">Aa<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3;\">16px / 1.75 · DM Sans 400<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 28px;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3; min-width: 56px;\">kicker<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #545D6E; line-height: 1;\">Aa<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A2B3;\">11–12px · JetBrains Mono 500 · 0.14em<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"components\" style=\"padding: clamp(48px, 7vw, 88px) 0; border-bottom: 1px solid rgba(20,24,35,0.10);\">\n    <span class=\"nh-kicker\"><span class=\"nh-kicker__num\">06<\u002Fspan>Components<\u002Fspan>\n    <h2 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; color: #0E1420; margin: 14px 0 16px;\">UI components<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 1.7; color: #475467; max-width: 660px; margin: 0 0 36px; text-wrap: pretty;\">Live components from the NeuroHome design system. These are the real thing, not screenshots — build from the library rather than restyling raw HTML.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 16px;\">\n      <div style=\"background: #FBFAF7; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; padding: 26px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E; margin-bottom: 18px;\">Buttons<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px;\">\n          <x-import component-from-global-scope=\"NeuroHomeDS.Button\" variant=\"primary\" size=\"lg\" hint-size=\"200px,52px\">Book a Discovery call<\u002Fx-import>\n          <x-import component-from-global-scope=\"NeuroHomeDS.Button\" variant=\"ghost\" hint-size=\"120px,44px\">Learn more<\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"font-size: 13.5px; line-height: 1.7; color: #545D6E; margin-top: 18px;\">One primary per view. Primary carries the cyan brand shadow; ghost is for the secondary path.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FBFAF7; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; padding: 26px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E; margin-bottom: 18px;\">Labels<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px;\">\n          <x-import component-from-global-scope=\"NeuroHomeDS.Pill\" dot=\"{{ true }}\" hint-size=\"150px,30px\">Now enrolling<\u002Fx-import>\n          <x-import component-from-global-scope=\"NeuroHomeDS.Kicker\" num=\"02\" hint-size=\"140px,20px\">Our approach<\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"font-size: 13.5px; line-height: 1.7; color: #545D6E; margin-top: 18px;\">Pill sits above a hero for announcements. Kicker opens a section and takes the section number.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 16px;\">\n      <x-import component-from-global-scope=\"NeuroHomeDS.Card\" title=\"Sensory regulation\" hint-size=\"100%,190px\">Protocols that address vestibular and proprioceptive input before behaviour is addressed at all.<\u002Fx-import>\n      <x-import component-from-global-scope=\"NeuroHomeDS.StepCard\" step=\"01\" tag=\"Week 1\" title=\"Assessment\" hint-size=\"100%,190px\">A full neurological workup establishes the baseline the whole protocol is measured against.<\u002Fx-import>\n      <x-import component-from-global-scope=\"NeuroHomeDS.Panel\" heading=\"At a glance\" hint-size=\"100%,190px\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 24px;\">\n          <x-import component-from-global-scope=\"NeuroHomeDS.StatItem\" value=\"6\" label=\"continents\" hint-size=\"80px,60px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"NeuroHomeDS.StatItem\" value=\"12wk\" label=\"protocol\" hint-size=\"80px,60px\"><\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fx-import>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;\">\n      <x-import component-from-global-scope=\"NeuroHomeDS.Quote\" quote=\"We were told to wait and see for three years. Eight weeks in, he looked at me when I said his name.\" name=\"Parent, Lisbon\" detail=\"Home protocol, week 8\" hint-size=\"100%,200px\"><\u002Fx-import>\n      <div style=\"background: #FBFAF7; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; padding: 26px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E; margin-bottom: 14px;\">FAQ<\u002Fdiv>\n        <x-import component-from-global-scope=\"NeuroHomeDS.FAQItem\" question=\"Is this a replacement for therapy?\" default-open=\"{{ true }}\" hint-size=\"100%,120px\">No. NeuroHome runs alongside existing therapy and school support. We share the protocol with your care team on request.<\u002Fx-import>\n        <x-import component-from-global-scope=\"NeuroHomeDS.FAQItem\" question=\"How much time does it take each day?\" hint-size=\"100%,56px\">Most protocols run 20 to 40 minutes a day, split across two sessions.<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"voice\" style=\"padding: clamp(48px, 7vw, 88px) 0; border-bottom: 1px solid rgba(20,24,35,0.10);\">\n    <span class=\"nh-kicker\"><span class=\"nh-kicker__num\">07<\u002Fspan>Voice<\u002Fspan>\n    <h2 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; color: #0E1420; margin: 14px 0 16px;\">How we sound<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 1.7; color: #475467; max-width: 660px; margin: 0 0 36px; text-wrap: pretty;\">The authority of a clinician with the warmth of a family ally. Clear, direct, never condescending.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 32px;\">\n      <div class=\"nh-panel\"><div class=\"nh-panel__h\">Evidence-first<\u002Fdiv><p style=\"margin: 0; font-size: 15px; line-height: 1.75; color: #475467;\">Every claim is backed by clinical evidence. We cite research, reference protocols and explain the neurology. Parents trust us because we show our work.<\u002Fp><\u002Fdiv>\n      <div class=\"nh-panel\"><div class=\"nh-panel__h\">Home-centred<\u002Fdiv><p style=\"margin: 0; font-size: 15px; line-height: 1.75; color: #475467;\">We meet families where they are — literally. Language reflects the home: comfortable, familiar, safe. Clinical without being cold.<\u002Fp><\u002Fdiv>\n      <div class=\"nh-panel\"><div class=\"nh-panel__h\">Parent-empowering<\u002Fdiv><p style=\"margin: 0; font-size: 15px; line-height: 1.75; color: #475467;\">Parents aren't passive recipients, they're trained partners. Our language puts agency in their hands: you deliver, you observe, you guide.<\u002Fp><\u002Fdiv>\n      <div class=\"nh-panel\"><div class=\"nh-panel__h\">Hope without hype<\u002Fdiv><p style=\"margin: 0; font-size: 15px; line-height: 1.75; color: #475467;\">We never promise miracles. We share real progress, real timelines, real outcomes. Hope grounded in evidence, not desperation.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;\">\n      <div style=\"border-left: 3px solid #2BA8E0; padding-left: 20px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #2559C0; margin-bottom: 12px;\">DO SAY<\u002Fdiv>\n        <div style=\"font-size: 14.5px; line-height: 2; color: #475467;\">\"Your child's protocol targets the right cerebellum.\"<br>\"Many families see measurable changes within 8–12 weeks.\"<br>\"You'll be trained to deliver these exercises at home.\"<br>\"The same protocol used in our clinical centres.\"<br>\"Drug-free, clinician-guided, science-backed.\"<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-left: 3px solid #D1495B; padding-left: 20px;\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #D1495B; margin-bottom: 12px;\">DON'T SAY<\u002Fdiv>\n        <div style=\"font-size: 14.5px; line-height: 2; color: #475467;\">\"Cure\" or \"fix\" — use support, strengthen, build.<br>\"Suffering from autism\" — use on the spectrum.<br>\"Revolutionary breakthrough\" — let results speak.<br>\"Easy\" or \"simple\" — this takes real commitment.<br>Medical jargon without explanation.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"endorser\" style=\"padding: clamp(48px, 7vw, 88px) 0; border-bottom: 1px solid rgba(20,24,35,0.10);\">\n    <span class=\"nh-kicker\"><span class=\"nh-kicker__num\">08<\u002Fspan>Endorser<\u002Fspan>\n    <h2 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; color: #0E1420; margin: 14px 0 16px;\">Neurosage HUB relationship<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 1.7; color: #475467; max-width: 660px; margin: 0 0 36px; text-wrap: pretty;\">NeuroHome is the at-home arm of Neurosage HUB. The relationship is endorsed: NeuroHome stands on its own, and carries Neurosage HUB's clinical credibility in the tagline.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 32px;\">\n      <div class=\"nh-panel\"><div class=\"nh-panel__h\">NeuroHome<\u002Fdiv><p style=\"margin: 0 0 18px; font-size: 15px; line-height: 1.75; color: #475467;\">Consumer-facing. Warm. Sand-based. Speaks to parents. \"Home\" is the operative word: accessibility, comfort, family.<\u002Fp><div style=\"background: #FFFFFF; border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; padding: 18px; display: flex; justify-content: center;\"><img src=\"07a93a48-4c75-4cee-bade-4b151ac843dc\" alt=\"NeuroHome\" style=\"width: 100%; max-width: 190px; height: auto;\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"nh-panel\"><div class=\"nh-panel__h\">Neurosage HUB<\u002Fdiv><p style=\"margin: 0 0 18px; font-size: 15px; line-height: 1.75; color: #475467;\">The clinical parent. Institutional credibility, practitioner network and research backbone. It appears as the endorsement line, never as a competing lockup.<\u002Fp><div style=\"background: #FFFFFF; border: 1px solid rgba(20,24,35,0.10); border-radius: 12px; padding: 18px; display: flex; align-items: center; justify-content: center; min-height: 68px;\"><span style=\"font-family: 'DM Sans', sans-serif; font-size: 17px; font-weight: 500; color: #545D6E;\">by <span style=\"color: #1D2939; font-weight: 700;\">Neurosage HUB<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #FBFAF7; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; padding: clamp(22px, 3vw, 32px); margin-bottom: 24px;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E; margin-bottom: 20px;\">Endorsement rules<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px;\">\n        <div><div style=\"font-weight: 700; font-size: 14.5px; color: #1D2939; margin-bottom: 6px;\">Where it appears<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.75; color: #475467;\">First-impression placements: site header, decks, printed material, landing pages, email signatures.<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-weight: 700; font-size: 14.5px; color: #1D2939; margin-bottom: 6px;\">Where it doesn't<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.75; color: #475467;\">App chrome, favicons, avatars and anything under 200px wide — use the no-tagline lockup there.<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-weight: 700; font-size: 14.5px; color: #1D2939; margin-bottom: 6px;\">Wording<\u002Fdiv><div style=\"font-size: 14px; line-height: 1.75; color: #475467;\">Always \"by Neurosage HUB\", sentence case, HUB in capitals. Never abbreviate to NSH or set it in cyan.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; padding: 40px; display: flex; align-items: center; justify-content: center; min-height: 170px;\"><img src=\"70644464-8dce-4251-aae4-dd135d5bfa26\" alt=\"Endorsed lockup on light\" style=\"width: 100%; max-width: 300px; height: auto;\"><\u002Fdiv>\n      <div style=\"background: #0E1420; border-radius: 22px; padding: 40px; display: flex; align-items: center; justify-content: center; min-height: 170px;\"><img src=\"872eefab-b4b8-450d-8f36-b65e13d461be\" alt=\"Endorsed lockup on dark\" style=\"width: 100%; max-width: 300px; height: auto;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"applications\" style=\"padding: clamp(48px, 7vw, 88px) 0; border-bottom: 1px solid rgba(20,24,35,0.10);\">\n    <span class=\"nh-kicker\"><span class=\"nh-kicker__num\">09<\u002Fspan>Applications<\u002Fspan>\n    <h2 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; color: #0E1420; margin: 14px 0 16px;\">In use<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 1.7; color: #475467; max-width: 660px; margin: 0 0 36px; text-wrap: pretty;\">Three reference layouts. Each one shows which lockup to reach for and how much cyan is enough.<\u002Fp>\n\n    <div style=\"background: #FBFAF7; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; overflow: hidden; margin-bottom: 16px;\">\n      <div style=\"padding: 14px 20px; border-bottom: 1px solid rgba(20,24,35,0.10); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E;\">Web header<\u002Fdiv>\n      <div style=\"padding: 20px;\">\n        <div style=\"background: #FFFFFF; border: 1px solid rgba(20,24,35,0.10); border-radius: 16px; overflow: hidden;\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 16px 22px; border-bottom: 1px solid rgba(20,24,35,0.10);\">\n            <img src=\"07a93a48-4c75-4cee-bade-4b151ac843dc\" alt=\"NeuroHome\" style=\"height: 26px; width: auto;\">\n            <div style=\"display: flex; align-items: center; gap: 22px; flex-wrap: wrap;\">\n              <span style=\"font-size: 14px; color: #475467;\">Approach<\u002Fspan>\n              <span style=\"font-size: 14px; color: #475467;\">Results<\u002Fspan>\n              <span style=\"font-size: 14px; color: #475467;\">For clinicians<\u002Fspan>\n              <x-import component-from-global-scope=\"NeuroHomeDS.Button\" variant=\"primary\" hint-size=\"150px,44px\">Book a call<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: clamp(28px, 4vw, 52px) 22px; text-align: center; background: #F4F0EA;\">\n            <span class=\"nh-pill\">Now enrolling · Spring cohort<\u002Fspan>\n            <h3 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(26px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; color: #0E1420; margin: 18px auto 14px; max-width: 620px; text-wrap: pretty;\">Clinical neurology, run from your living room.<\u002Fh3>\n            <p style=\"font-size: 16px; line-height: 1.7; color: #475467; max-width: 520px; margin: 0 auto;\">A personalised, drug-free protocol built from a full neurological assessment — and a clinician who stays with you.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;\">\n      <div style=\"background: #FBFAF7; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; overflow: hidden;\">\n        <div style=\"padding: 14px 20px; border-bottom: 1px solid rgba(20,24,35,0.10); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E;\">Social post<\u002Fdiv>\n        <div style=\"padding: 20px;\">\n          <div style=\"aspect-ratio: 1 / 1; background: #0E1420; border-radius: 16px; padding: clamp(20px, 3vw, 32px); display: flex; flex-direction: column; justify-content: space-between;\">\n            <img src=\"0eab368a-7fe4-4bf5-b2eb-abcc0850cdc7\" alt=\"NeuroHome\" style=\"height: 26px; width: auto; align-self: flex-start;\">\n            <div>\n              <div style=\"font-family: 'Outfit', sans-serif; font-size: clamp(22px, 3.4vw, 34px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; color: #EAF0F6; text-wrap: pretty;\">Eight weeks of daily work.<br><span style=\"color: #00C2FF;\">One look across the room.<\u002Fspan><\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(234,240,246,0.62); margin-top: 18px;\">Parent story · Lisbon<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13.5px; line-height: 1.7; color: #545D6E; margin-top: 14px;\">Navy ground, white knockout logo, one cyan phrase. Never more than one cyan element per post.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #FBFAF7; border: 1px solid rgba(20,24,35,0.10); border-radius: 22px; overflow: hidden;\">\n        <div style=\"padding: 14px 20px; border-bottom: 1px solid rgba(20,24,35,0.10); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #545D6E;\">Email signature<\u002Fdiv>\n        <div style=\"padding: 20px;\">\n          <div style=\"background: #FFFFFF; border: 1px solid rgba(20,24,35,0.10); border-radius: 16px; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px;\">\n            <img src=\"f6a9a15c-cecd-4615-afde-72d88f6bc8ed\" alt=\"NeuroHome\" style=\"width: 52px; height: 52px;\">\n            <div style=\"border-left: 1px solid rgba(20,24,35,0.10); padding-left: 20px; min-width: 0;\">\n              <div style=\"font-weight: 700; font-size: 15px; color: #1D2939;\">Dr. Full Name<\u002Fdiv>\n              <div style=\"font-size: 13.5px; color: #545D6E; margin-top: 2px;\">Clinical lead, NeuroHome<\u002Fdiv>\n              <div style=\"font-size: 13px; color: #545D6E; margin-top: 8px;\">by Neurosage HUB · <a href=\"#applications\">neurohome.com<\u002Fa><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13.5px; line-height: 1.7; color: #545D6E; margin-top: 14px;\">Use the PNG icon, not SVG — most mail clients strip vectors. Keep the endorsement line in the signature.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"tokens\" style=\"padding: clamp(48px, 7vw, 88px) 0;\">\n    <span class=\"nh-kicker\"><span class=\"nh-kicker__num\">10<\u002Fspan>Tokens<\u002Fspan>\n    <h2 style=\"font-family: 'Outfit', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; color: #0E1420; margin: 14px 0 16px;\">Design tokens<\u002Fh2>\n    <p style=\"font-size: 17px; line-height: 1.7; color: #475467; max-width: 660px; margin: 0 0 36px; text-wrap: pretty;\">The <span style=\"font-family: 'JetBrains Mono', monospace;\">--nh-*<\u002Fspan> custom properties shipped by the NeuroHome design system. Copy these rather than hard-coding hex values.<\u002Fp>\n\n    <div style=\"background: #0E1420; border-radius: 22px; padding: clamp(22px, 3vw, 32px); overflow-x: auto; margin-bottom: 16px;\">\n      <pre style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.9; color: #A9B6C8; margin: 0; white-space: pre-wrap;\">:root {\n  /* neutrals */\n  --nh-sand:#F4F0EA; --nh-sand-2:#EFEAE2; --nh-paper:#FBFAF7;\n  --nh-ink:#1D2939; --nh-ink-dim:#475467; --nh-slate:#545D6E;\n  --nh-hair:rgba(20,24,35,0.10); --nh-hair-strong:rgba(20,24,35,0.14);\n\n  /* dark */\n  --nh-navy:#0E1420; --nh-light:#EAF0F6;\n  --nh-light-dim:rgba(234,240,246,0.62); --nh-light-hair:rgba(234,240,246,0.10);\n\n  /* blues */\n  --nh-cyan:#00C2FF; --nh-azure:#2BA8E0; --nh-azure-pale:#7BC9EC; --nh-blue:#2559C0;\n  --nh-grad:linear-gradient(135deg,var(--nh-azure),#2D6FD9);\n  --nh-grad-light:linear-gradient(135deg,var(--nh-azure),var(--nh-azure-pale));\n\n  /* geometry + type */\n  --nh-radius:16px; --nh-radius-lg:22px; --nh-pill:100px;\n  --nh-shadow-brand:0 10px 30px rgba(0,194,255,.28);\n  --nh-shadow-md:0 14px 40px rgba(20,24,35,.08);\n  --nh-f-display:'Outfit',sans-serif;\n  --nh-f-body:'DM Sans',system-ui,sans-serif;\n  --nh-f-mono:'JetBrains Mono',monospace;\n}<\u002Fpre>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;\">\n      <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 16px; overflow: hidden;\"><div style=\"height: 96px; background: linear-gradient(135deg,#2BA8E0,#2D6FD9);\"><\u002Fdiv><div style=\"padding: 14px 18px; background: #FBFAF7; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 14px; color: #1D2939;\">--nh-grad<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E; margin-top: 2px;\">Headline emphasis, gradient numerals<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 16px; overflow: hidden;\"><div style=\"height: 96px; background: linear-gradient(135deg,#2BA8E0,#7BC9EC);\"><\u002Fdiv><div style=\"padding: 14px 18px; background: #FBFAF7; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 14px; color: #1D2939;\">--nh-grad-light<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E; margin-top: 2px;\">Emphasis on navy, dark-section accents<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border: 1px solid rgba(20,24,35,0.10); border-radius: 16px; overflow: hidden;\"><div style=\"height: 96px; background: #FBFAF7; display: flex; align-items: center; justify-content: center;\"><div style=\"width: 100px; height: 44px; border-radius: 100px; background: #00C2FF; box-shadow: 0 10px 30px rgba(0,194,255,.28);\"><\u002Fdiv><\u002Fdiv><div style=\"padding: 14px 18px; background: #FBFAF7; border-top: 1px solid rgba(20,24,35,0.10);\"><div style=\"font-weight: 700; font-size: 14px; color: #1D2939;\">--nh-shadow-brand<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #545D6E; margin-top: 2px;\">Primary buttons only<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding: 32px 0; border-top: 1px solid rgba(20,24,35,0.10); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;\">\n    <img src=\"07a93a48-4c75-4cee-bade-4b151ac843dc\" alt=\"NeuroHome\" style=\"height: 22px; width: auto;\">\n    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #545D6E;\">{{ versionLabel }} · by Neurosage HUB<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;versionLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;v2.0 · September 2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Guide&quot;},&quot;showChangelog&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Guide&quot;},&quot;showDownloads&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Guide&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      versionLabel: this.props.versionLabel ?? \"v2.0 · September 2026\",\n      showChangelog: this.props.showChangelog ?? true,\n      showDownloads: this.props.showDownloads ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
